name: upstream-sync
on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.repository == 'khs0927/korean-land-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream and open PR (never auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/UrbanWatcherKr/korean-land-mcp.git
          git fetch upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind"
          [ "$behind" -eq 0 ] && exit 0
          branch=upstream-sync/auto
          git push -f origin upstream/main:refs/heads/$branch
          if [ -z "$(gh pr list --head $branch --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head $branch \
              --title "chore: sync from upstream UrbanWatcherKr/korean-land-mcp ($behind commits)" \
              --body "Automated upstream sync. Review and merge manually; conflicts must be resolved by hand."
          fi
